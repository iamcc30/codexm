name: experimental-history-projector

on:
  push:
    branches:
      - "experiment/projection-only-history"
  pull_request:
    paths:
      - "experimental/history-projection/**"
      - ".github/workflows/projection-helper-probe.yml"
      - "scripts/native-history-acceptance.py"
      - "internal/session/**"
      - "internal/historycompat/**"
      - "internal/cli/**"
      - "internal/codex/**"
      - "internal/appserver/**"

permissions:
  contents: read

concurrency:
  group: experimental-history-projector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-projection-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      UPSTREAM_COMMIT: 6ff1e1ca3b30fc8b914720681fcf5fe62e95f856
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test current-tip diagnostic outcome handling
        run: python3 -m unittest discover -s experimental/history-projection/tests -v
      - name: Build codexm without enabling the experimental helper
        run: |
          go test ./... -count=1
          go vet ./...
          go build -o "$RUNNER_TEMP/codexm-native-test" ./cmd/codexm
      - name: Test read-only native compatibility guards
        id: compatibility
        continue-on-error: true
        run: |
          go test -race ./internal/historycompat -count=1
          go vet ./internal/historycompat
      - name: Test integrated private recovery core
        id: recovery-core
        continue-on-error: true
        run: |
          go test ./internal/session -count=1
          go test -race ./internal/session -run "FrozenV2|NativeHistory|Lease" -count=1
          go vet ./internal/session
      - name: Check out exact official projector source
        uses: actions/checkout@v6
        with:
          repository: openai/codex
          ref: 6ff1e1ca3b30fc8b914720681fcf5fe62e95f856
          path: .projection-upstream
          persist-credentials: false
      - name: Apply audited pinned native helper patch
        run: |
          test "$(git -C .projection-upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          python3 experimental/history-projection/helper/build_patch.py .projection-upstream --apply
      - name: Install official pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Restore public pinned Rust dependency sources
        id: rust-sources
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
          key: ${{ runner.os }}-projection-sources-${{ env.UPSTREAM_COMMIT }}
      - name: Build only the experimental history projector
        working-directory: .projection-upstream/codex-rs
        run: cargo +1.95.0 build --locked -p codex-thread-store --features projection-only-experiment --example projection_only --example publish_projection --example native_lock_probe --example native_history_helper
      - name: Test native schema, tip CAS, preservation and owner-lock guards
        id: native-unit
        continue-on-error: true
        working-directory: .projection-upstream/codex-rs
        run: cargo +1.95.0 test --locked -p codex-thread-store --features projection-only-experiment --lib native_history_helper::tests
      - name: Save public pinned Rust dependency sources
        continue-on-error: true
        if: ${{ always() && steps.rust-sources.outcome == 'success' && steps.rust-sources.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
          key: ${{ runner.os }}-projection-sources-${{ env.UPSTREAM_COMMIT }}
      - name: Install checksum-pinned official native Codex test package
        id: native-package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-codex"
          curl --proto '=https' --tlsv1.2 -fL --retry 3 \
            https://github.com/openai/codex/releases/download/rust-v0.166.0/codex-package-x86_64-unknown-linux-musl.tar.gz \
            -o "$RUNNER_TEMP/native-codex.tar.gz"
          echo "1d44b28bc4ac9937d7d3532264baa68a507ce364956a0d4ebb856f331cdee254  $RUNNER_TEMP/native-codex.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/native-codex.tar.gz" -C "$RUNNER_TEMP/native-codex"
          mapfile -t binaries < <(find "$RUNNER_TEMP/native-codex" -type f -path '*/bin/codex')
          test "${#binaries[@]}" -eq 1
          echo "CODEXM_NATIVE_TEST_BINARY=${binaries[0]}" >> "$GITHUB_ENV"
          sha256sum "${binaries[0]}"
      - name: Build opt-in native-history CLI with packaged executable pins
        id: native-build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-history-cli" "$RUNNER_TEMP/native-history-fault-cli"
          cp .projection-upstream/codex-rs/target/debug/examples/native_history_helper "$RUNNER_TEMP/native-history-cli/native_history_helper"
          cp "$RUNNER_TEMP/native-history-cli/native_history_helper" "$RUNNER_TEMP/native-history-fault-cli/native_history_helper"
          native_sha=$(sha256sum "$CODEXM_NATIVE_TEST_BINARY" | cut -d ' ' -f 1)
          helper_sha=$(sha256sum "$RUNNER_TEMP/native-history-cli/native_history_helper" | cut -d ' ' -f 1)
          pins="-X github.com/iamcc30/codexm/internal/session.NativeHistoryBinarySHA256=$native_sha -X github.com/iamcc30/codexm/internal/session.NativeHistoryHelperSHA256=$helper_sha"
          go build -ldflags "$pins" -o "$RUNNER_TEMP/native-history-cli/codexm" ./cmd/codexm
          go build -tags nativehistorytest -ldflags "$pins" -o "$RUNNER_TEMP/native-history-fault-cli/codexm" ./cmd/codexm
      - name: Prove native UI parity in isolated synthetic profiles
        run: |
          python3 experimental/history-projection/probe.py \
            --helper .projection-upstream/codex-rs/target/debug/examples/projection_only \
            --publisher .projection-upstream/codex-rs/target/debug/examples/publish_projection \
            --lock-probe .projection-upstream/codex-rs/target/debug/examples/native_lock_probe \
            --recovery-probe \
            --codex "$CODEXM_NATIVE_TEST_BINARY" \
            --codexm "$RUNNER_TEMP/codexm-native-test" \
            --expected-version 0.166.0 \
            --native-harness scripts/native-history-acceptance.py \
            --artifacts "$RUNNER_TEMP/projection-helper-logs"
      - name: Verify known JSONL-only tip-selection blocker
        if: ${{ !cancelled() && steps.native-package.outcome == 'success' }}
        run: |
          python3 experimental/history-projection/current_tip_checks.py \
            --expect-stale-tip \
            --codex "$CODEXM_NATIVE_TEST_BINARY" \
            --codexm "$RUNNER_TEMP/codexm-native-test" \
            --native-harness scripts/native-history-acceptance.py \
            --artifacts "$RUNNER_TEMP/projection-helper-logs/current-tip"
      - name: Require opt-in native tip publication and cold restart acceptance
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: |
          python3 experimental/history-projection/current_tip_checks.py \
            --native-history \
            --codex "$CODEXM_NATIVE_TEST_BINARY" \
            --codexm "$RUNNER_TEMP/native-history-cli/codexm" \
            --native-harness scripts/native-history-acceptance.py \
            --artifacts "$RUNNER_TEMP/projection-helper-logs/native-tip"
      - name: Recover real native publication after interrupted files, SQL and registry phases
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          for point in files:verified sql:returned registry:verified; do
            python3 experimental/history-projection/current_tip_checks.py \
              --native-history \
              --fault-codexm "$RUNNER_TEMP/native-history-fault-cli/codexm" \
              --fault-point "$point" \
              --codex "$CODEXM_NATIVE_TEST_BINARY" \
              --codexm "$RUNNER_TEMP/native-history-cli/codexm" \
              --native-harness scripts/native-history-acceptance.py \
              --artifacts "$RUNNER_TEMP/projection-helper-logs/native-recovery-${point/:/-}"
          done
      - name: Recover uncertain native history and state commits after helper death
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          for point in history_committed state_before_commit state_after_commit; do
            python3 experimental/history-projection/current_tip_checks.py \
              --native-history \
              --fault-codexm "$RUNNER_TEMP/native-history-fault-cli/codexm" \
              --helper-fault-point "$point" \
              --codex "$CODEXM_NATIVE_TEST_BINARY" \
              --codexm "$RUNNER_TEMP/native-history-cli/codexm" \
              --native-harness scripts/native-history-acceptance.py \
              --artifacts "$RUNNER_TEMP/projection-helper-logs/native-recovery-helper-${point//_/-}"
          done
      - name: Show synthetic diagnostics on failure
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          for log in "$RUNNER_TEMP/projection-helper-logs/"*.json "$RUNNER_TEMP/projection-helper-logs/"*.log "$RUNNER_TEMP/projection-helper-logs/current-tip/"*.json "$RUNNER_TEMP/projection-helper-logs/current-tip/"*.log "$RUNNER_TEMP/projection-helper-logs/native-tip/"*.json "$RUNNER_TEMP/projection-helper-logs/native-tip/"*.log "$RUNNER_TEMP/projection-helper-logs/native-recovery-"*/*.json "$RUNNER_TEMP/projection-helper-logs/native-recovery-"*/*.log; do
            echo "--- $(basename "$log") ---"
            tail -100 "$log"
          done
      - name: Require compatibility, recovery and native guard checks to pass
        if: always()
        run: |
          test "${{ steps.compatibility.outcome }}" = success
          test "${{ steps.recovery-core.outcome }}" = success
          test "${{ steps.native-unit.outcome }}" = success
